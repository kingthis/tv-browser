<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remote control test</title>
<script src="../browser.js"></script>
<style>body { margin: 0; font: 20px system-ui; } #target { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }</style>
</head>
<body>
<a id="target" href="#clicked">Full-page link</a>
<pre id="log" style="position:absolute;bottom:0"></pre>
<script>
  function press(code) {
    var e = new KeyboardEvent('keydown', { keyCode: code, which: code, bubbles: true, cancelable: true });
    window.dispatchEvent(e);
    return e.defaultPrevented;
  }
  function pointerPos() {
    var t = document.querySelector('#tv-browser-ui > div').style.transform;
    var m = /translate\((-?\d+)px,\s*(-?\d+)px\)/.exec(t);
    return m ? [Number(m[1]), Number(m[2])] : null;
  }
  setTimeout(function () {
    var r = {};
    var start = pointerPos();
    for (var i = 0; i < 5; i++) press(39);
    var after = pointerPos();
    r.pointerMovedRight = after[0] > start[0] && after[1] === start[1];
    r.arrowDefaultPrevented = press(40);
    press(13);
    r.okClickedLink = location.hash === '#clicked';
    r.channelUpOpensBar = press(427) && document.querySelector('#tv-browser-ui > div:nth-child(2)').style.display === 'flex';
    r.addressFocused = document.activeElement && document.activeElement.tagName === 'INPUT';
    press(10009);
    r.backClosesBar = document.querySelector('#tv-browser-ui > div:nth-child(2)').style.display === 'none';
    document.getElementById('log').textContent = JSON.stringify(r, null, 2);
  }, 300);
</script>
</body>
</html>
